<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.x-label{text-align:center;font-size:11px;font-weight:600;color:#52514e;padding:0 2px}
.mosaic-inner{display:flex;gap:3px}
.band-col{display:flex;flex-direction:column;gap:3px;position:relative}
.mosaic-cell{position:relative;cursor:pointer;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;transition:opacity .12s;min-height:24px}
.mosaic-cell:hover{opacity:.82;z-index:10}
.cell-name{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.cell-rate{font-size:13px;font-weight:800;line-height:1.1;text-align:center}
.cell-gap{font-size:10px;opacity:.85;text-align:center;white-space:nowrap}
.band-label-area{display:flex;gap:3px;margin-top:8px}
.band-sub{text-align:center;font-size:10px;color:#898781}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;align-items:center}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#52514e}

const MGR_COLOR = {"Masahiro Kamiya":"#2a78d6","Yoshiaki Yamamoto":"#eb6834","Yukari Nitta":"#1baf7a","Yuta Hatanaka":"#9b5de5","Tomoya Hagino":"#eda100","Takayuki Kobayashi":"#e34948"};
const BANDS = ['0-10k','10-25k','25-50k','50-100k'];
const TARGETS = {'0-10k':75,'10-25k':70,'25-50k':70,'50-100k':66};
const ALL_MGRS = Object.keys(MGR_COLOR);

function fmtK(n){return n===0?'—':'$'+Math.round(n/1000).toLocaleString()+'k'}

function gapColor(owned_rate, target, n){
  if(n===0) return {bg:'#ebebeb',fg:'#aaa'};
  const progress = Math.min(owned_rate/target, 1.0);
  if(progress >= 1.0) return {bg:'#22c55e',fg:'#fff'};
  if(progress >= 0.85) return {bg:'#d1fae5',fg:'#065f46'};
  if(progress >= 0.65) return {bg:'#d9f5e8',fg:'#1a7a50'};
  if(progress >= 0.5)  return {bg:'#fef9c3',fg:'#854d0e'};
  const t = Math.pow(Math.max(0,1 - progress*2), 0.5);
  const r = Math.round(254-t*(254-200)), g2=Math.round(242-t*(242-30)), bl=Math.round(240-t*(240-30));
  return {bg:`rgb(${r},${g2},${bl})`, fg: t>0.45?'#fff':'#1a0a00'};
}

function buildMgrData(){
  const map = {};
  ALL_MGRS.forEach(m => {
    map[m] = {key:m, label:m, total_amt:0, total_owned_amt:0, bands:{}};
    BANDS.forEach(b => map[m].bands[b] = {amt:0,owned_amt:0,n:0,owned_n:0,target:TARGETS[b]});
  });
  RAW.forEach(d => {
    const m = d.ecs_mgr; if(!map[m]) return;
    map[m].total_amt += d.total_amt; map[m].total_owned_amt += d.total_owned_amt;
    BANDS.forEach(b => { const v=d.bands[b]||{};
      map[m].bands[b].amt+=v.amt||0; map[m].bands[b].owned_amt+=v.owned_amt||0;
      map[m].bands[b].n+=v.n||0; map[m].bands[b].owned_n+=v.owned_n||0;
    });
  });
  ALL_MGRS.forEach(m => {
    map[m].overall_owned_rate = map[m].total_amt>0 ? map[m].total_owned_amt/map[m].total_amt*100 : 0;
    map[m].total_gap = 0;
    BANDS.forEach(b => { const v=map[m].bands[b];
      v.owned_rate = v.amt>0 ? v.owned_amt/v.amt*100 : 0;
      v.gap_amt = Math.max(0, v.amt*v.target/100 - v.owned_amt);
      map[m].total_gap += v.gap_amt;
    });
  });
  return ALL_MGRS.map(m => map[m]);
}

function buildTeamData(){
  return RAW
    .filter(d => ALL_MGRS.includes(d.ecs_mgr) && d.total_amt > 0)
    .sort((a,b) => b.total_amt - a.total_amt)
    .map(d => ({
      key: d.lvl7+'|'+d.ecs_mgr,
      label: d.lvl7.length > 22 ? d.lvl7.slice(0,20)+'…' : d.lvl7,
      full_label: d.lvl7,
      ecs_mgr: d.ecs_mgr,
      total_amt: d.total_amt,
      total_owned_amt: d.total_owned_amt,
      overall_owned_rate: d.overall_owned_rate,
      total_gap: d.total_gap,
      bands: d.bands
    }));
}

const MGR_DATA  = buildMgrData();
const TEAM_DATA = buildTeamData();

const totalBCO   = MGR_DATA.reduce((s,m)=>s+m.total_amt,0);
const totalOwned = MGR_DATA.reduce((s,m)=>s+m.total_owned_amt,0);
const totalGap   = MGR_DATA.reduce((s,m)=>s+m.total_gap,0);
const overallRate = totalBCO>0 ? totalOwned/totalBCO*100 : 0;

document.getElementById('kpi-row').innerHTML=`
  <div class="kpi"><div class="kpi-lbl">ECS BCO総額</div><div class="kpi-val">${fmtK(totalBCO)}</div></div>
  <div class="kpi"><div class="kpi-lbl">総ギャップ</div><div class="kpi-val red">${fmtK(totalGap)}</div></div>
  <div class="kpi"><div class="kpi-lbl">現Owned率（金額）</div><div class="kpi-val">${overallRate.toFixed(1)}%</div></div>
  <div class="kpi"><div class="kpi-lbl">FY28目標</div><div class="kpi-val" style="color:#1baf7a">70%</div></div>`;

const viewModes = {mgr:'prop', team:'prop'};

function renderMosaic(containerId, rows, paneKey){
  const TOTAL_H = 500;
  const GAP = 2;
  const mode = viewModes[paneKey];

  const bandTotals = {};
  BANDS.forEach(b => bandTotals[b] = rows.reduce((s,r)=>s+(r.bands[b]?.amt||0),0));
  const grandTotal = Object.values(bandTotals).reduce((a,b)=>a+b,0);

  const container = document.getElementById(containerId);
  container.innerHTML = '';

  if(paneKey === 'mgr'){
    const legend = document.createElement('div');
    legend.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;';
    ALL_MGRS.forEach(m => {
      const item = document.createElement('div');
      item.style.cssText = 'display:flex;align-items:center;gap:4px;font-size:11px;';
      item.innerHTML = `<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${MGR_COLOR[m]}"></span>${m.split(' ').slice(-1)[0]}`;
      legend.appendChild(item);
    });
    container.appendChild(legend);
  }

  const xLabels = document.createElement('div');
  xLabels.className = 'x-labels';

  const inner = document.createElement('div');
  inner.className = 'mosaic-inner';
  inner.style.height = TOTAL_H + 'px';

  const bandSubRow = document.createElement('div');
  bandSubRow.className = 'band-label-area';

  BANDS.forEach(b => {
    const bTotal = bandTotals[b];
    const flexW = grandTotal > 0 ? bTotal/grandTotal*100 : 25;

    const xl = document.createElement('div');
    xl.className = 'x-label';
    xl.style.flex = `${flexW} 0 0`;
    xl.innerHTML = `<strong>${b}</strong>`;
    xLabels.appendChild(xl);

    const col = document.createElement('div');
    col.className = 'band-col';
    col.style.flex = `${flexW} 0 0`;
    col.style.height = TOTAL_H + 'px';

    rows.forEach(row => {
      const v = row.bands[b] || {amt:0,owned_amt:0,n:0,owned_n:0,owned_rate:0,gap_amt:0,target:TARGETS[b]};
      let cellH;
      if(mode === 'equal'){
        cellH = (TOTAL_H - GAP*(rows.length-1)) / rows.length;
      } else {
        const share = bTotal > 0 ? v.amt/bTotal : 1/rows.length;
        cellH = Math.max(24, share * (TOTAL_H - GAP*(rows.length-1)));
      }

      const {bg, fg} = gapColor(v.owned_rate, v.target, v.n);
      const cell = document.createElement('div');
      cell.className = 'mosaic-cell';
      cell.style.cssText = `background:${bg};color:${fg};height:${cellH}px;flex-shrink:0;`;
      cell.dataset.rowKey = row.key || row.label;
      cell.dataset.band   = b;
      cell.dataset.pane   = paneKey;

      if(paneKey === 'team' && row.ecs_mgr && MGR_COLOR[row.ecs_mgr]){
        cell.style.borderLeft = `3px solid ${MGR_COLOR[row.ecs_mgr]}`;
      }

      if(cellH >= 32){
        const name = paneKey === 'mgr' ? row.label.split(' ').slice(-1)[0] : row.label;
        cell.innerHTML = `
          <span class="cell-name" style="color:${fg}">${name}</span>
          <span class="cell-rate" style="color:${fg}">${v.owned_rate.toFixed(0)}%</span>
          ${cellH >= 50 ? `<span class="cell-gap" style="color:${fg}">${v.n>0?fmtK(v.gap_amt):''}</span>` : ''}`;
      }
      col.appendChild(cell);
    });

    inner.appendChild(col);

    const bs = document.createElement('div');
    bs.className = 'band-sub';
    bs.style.flex = `${flexW} 0 0`;
    bs.innerHTML = `${fmtK(bTotal)}<br><span style="font-size:9px">${(flexW).toFixed(0)}%</span>`;
    bandSubRow.appendChild(bs);
  });

  container.appendChild(xLabels);
  container.appendChild(inner);
  const bw = document.createElement('div');
  bw.style.cssText = 'display:flex;margin-top:6px;';
  bw.appendChild(bandSubRow);
  container.appendChild(bw);

  const tt = document.getElementById('tooltip');
  container.querySelectorAll('.mosaic-cell[data-band]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      const band = el.dataset.band;
      const p    = el.dataset.pane;
      let row, ttTitle, mgrColor;
      if(p === 'mgr'){
        const key = el.dataset.rowKey;
        row = MGR_DATA.find(r => r.key === key);
        ttTitle = row ? row.label : key;
        mgrColor = MGR_COLOR[ttTitle] || '#898781';
      } else {
        const key = el.dataset.rowKey;
        row = TEAM_DATA.find(r => (r.key||r.label) === key);
        ttTitle = row ? row.full_label : key;
        mgrColor = row && MGR_COLOR[row.ecs_mgr] ? MGR_COLOR[row.ecs_mgr] : '#898781';
      }
      if(!row) return;
      const v = row.bands[band] || {amt:0,owned_amt:0,n:0,owned_n:0,owned_rate:0,gap_amt:0,target:TARGETS[band]};
      tt.innerHTML = `<strong style="color:${mgrColor}">${ttTitle}</strong>
        ${p==='team'&&row.ecs_mgr?`<div style="font-size:10px;color:#898781">ECS Mgr: ${row.ecs_mgr}</div>`:''}
        <div style="font-size:11px;font-weight:600;margin-top:2px">Deal Band: ${band}（目標${v.target}%）</div>
        <div style="border-top:1px solid #e1e0d9;margin:5px 0"></div>
        <div style="display:flex;justify-content:space-between;gap:14px"><span style="color:#898781">BCO金額</span><span style="font-weight:600">${fmtK(v.amt)}</span></div>
        <div style="display:flex;justify-content:space-between;gap:14px;margin-top:2px"><span style="color:#898781">Owned金額</span><span style="font-weight:600">${fmtK(v.owned_amt)}</span></div>
        <div style="display:flex;justify-content:space-between;gap:14px;margin-top:2px"><span style="color:#898781">現Owned率</span><span style="font-weight:600;color:${v.owned_rate>=v.target?'#1baf7a':'#e34948'}">${v.owned_rate.toFixed(1)}%</span></div>
        <div style="display:flex;justify-content:space-between;gap:14px;margin-top:2px"><span style="color:#898781">追加必要額</span><span style="font-weight:600;color:#e34948">${fmtK(v.gap_amt)}</span></div>
        <div style="display:flex;justify-content:space-between;gap:14px;margin-top:2px"><span style="color:#898781">件数</span><span style="font-weight:600">${v.owned_n} / ${v.n}件</span></div>`;
      tt.classList.add('show');
    });
    el.addEventListener('mousemove', e => {
      const x=e.clientX+14, y=e.clientY-10;
      tt.style.left=(x+280>window.innerWidth?e.clientX-294:x)+'px';
      tt.style.top=y+'px';
    });
    el.addEventListener('mouseleave', () => tt.classList.remove('show'));
  });
}

// セレクトボックスにMgrオプションを追加
const mgrSelect = document.getElementById('team-mgr-filter');
ALL_MGRS.forEach(m => {
  const opt = document.createElement('option');
  opt.value = m;
  opt.textContent = m;
  mgrSelect.appendChild(opt);
});

function getFilteredTeamData(){
  const val = mgrSelect.value;
  return val === 'ALL' ? TEAM_DATA : TEAM_DATA.filter(r => r.ecs_mgr === val);
}

renderMosaic('mosaic-mgr', MGR_DATA, 'mgr');
renderMosaic('mosaic-team', TEAM_DATA, 'team');

document.querySelector('.tab-bar').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn'); if(!btn) return;
  const tab = btn.dataset.tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('on', b.dataset.tab===tab));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('on', p.id==='pane-'+tab));
  if(tab==='team'){
    renderMosaic('mosaic-team', getFilteredTeamData(), 'team');
  }
});

mgrSelect.addEventListener('change', () => {
  renderMosaic('mosaic-team', getFilteredTeamData(), 'team');
});

document.querySelectorAll('.vbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    const pane = btn.dataset.pane;
    const mode = btn.dataset.mode;
    viewModes[pane] = mode;
    document.querySelectorAll(`.vbtn[data-pane="${pane}"]`).forEach(b => b.classList.toggle('on', b.dataset.mode===mode));
    if(pane==='mgr') renderMosaic('mosaic-mgr', MGR_DATA, 'mgr');
    else renderMosaic('mosaic-team', getFilteredTeamData(), 'team');
  });
});
</script>
</body>
</html>
